name: Unzip
on:
  workflow_dispatch:
    inputs:
      zip:
        description: Zip filename in repo root
        default: GeminiOmniStudio-v3.zip
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and commit
        env:
          ZIP: ${{ inputs.zip }}
        run: |
          unzip -q "$ZIP" -d /tmp/x
          src=/tmp/x
          [ "$(ls -A /tmp/x | wc -l)" = 1 ] && src=/tmp/x/$(ls /tmp/x)
          cp -a "$src"/. .
          rm -f "$ZIP"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Unzip project"
          git push
