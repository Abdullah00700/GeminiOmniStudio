name: Apply zip
on:
  workflow_dispatch:
    inputs:
      zip:
        description: Zip filename in repo root
        default: GeminiOmniStudio-v4.zip
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace project with zip contents
        env:
          ZIP: ${{ inputs.zip }}
        run: |
          test -f "$ZIP" || { echo "Zip not found: $ZIP"; ls -la; exit 1; }
          rm -rf /tmp/x && mkdir /tmp/x
          unzip -q "$ZIP" -d /tmp/x
          src=/tmp/x
          [ "$(ls -A /tmp/x | wc -l)" = 1 ] && src=/tmp/x/$(ls /tmp/x)
          # wipe old project files (keeps .git, .github and the zip)
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name "$ZIP" -exec rm -rf {} +
          rsync -a --exclude .github "$src"/ ./
          rm -f "$ZIP"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Apply $ZIP"
          git push
